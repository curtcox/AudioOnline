# Deployment remains an explicit owner action (AGENTS.md).
name: Deploy Audio Online
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: audio-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    uses: ./.github/workflows/test.yml
  deploy:
    needs: test
    uses: curtcox/Tools-for-pages-with-state-in-URL-fragments/.github/workflows/pages.yml@v2
    with:
      path: '.'
      verify-marker: audio-fragment-kit-v0.4.3
